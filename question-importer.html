<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استيراد الأسئلة من صورة</title>
<style>
body{font-family:Arial,Tahoma,sans-serif;background:#f5f8fb;margin:0;color:#162033}
.wrap{max-width:1100px;margin:25px auto;padding:0 15px}
.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 8px 25px rgba(0,0,0,.06)}
input,select,textarea{font:inherit;width:100%;box-sizing:border-box;border:1px solid #dce4ea;border-radius:11px;padding:11px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
button{border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer}
.primary{background:#10b981;color:#fff}.blue{background:#229ED9;color:#fff}.muted{background:#edf2f5}
.q{border:1px solid #e1e7ec;border-radius:15px;padding:16px;margin:12px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status{padding:10px;border-radius:10px;background:#eef8f5;margin-top:10px}
.preview{max-width:100%;max-height:360px;display:block;border-radius:12px;margin-top:10px}
@media(max-width:700px){.grid,.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>📷 إضافة أسئلة من صورة كتاب</h1>
    <p>ارفع صورة تحتوي على سؤال واحد أو عدة أسئلة. سيتم استخراج النص والاختيارات ثم يمكنك مراجعة كل سؤال وتحديد نوعه والإجابة الصحيحة.</p>
    <div class="grid">
      <div><label>عنوان الاختبار</label><input id="examTitle" placeholder="مثال: امتحان الوحدة الأولى"></div>
      <div><label>الصف</label><select id="grade"><option value="1">أولى ثانوي</option><option value="2">ثانية ثانوي</option><option value="3">ثالثة ثانوي</option><option value="all">كل الصفوف</option></select></div>
      <div><label>الكورس</label><select id="courseId"><option value="">بدون ربط</option></select></div>
      <div><label>الفيديو / الدرس</label><select id="videoId"><option value="">بدون ربط</option></select></div>
    </div>
    <input id="imageFile" type="file" accept="image/*">
    <img id="preview" class="preview" hidden>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
      <button class="primary" id="ocrBtn">🔎 قراءة الصورة</button>
      <button class="muted" id="clearBtn">مسح</button>
    </div>
    <div id="status" class="status">جاهز.</div>
  </div>

  <div class="card" id="questionsCard" hidden>
    <h2>📝 مراجعة الأسئلة</h2>
    <p>يمكنك تعديل النص والاختيارات وتحديد نوع كل سؤال قبل الحفظ.</p>
    <div id="questions"></div>
    <button class="primary" id="saveBtn">💾 حفظ الاختبار بكل الأسئلة</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script type="module">
import { db, collection, getDocs, addDoc, serverTimestamp, authReady } from './js/firebase-config.js';
import { IMGBB_API_KEY } from './js/image-config.js';

const $=id=>document.getElementById(id);
let questions=[];

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

function normalizeArabicDigits(str){return String(str||'').replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));}
function parseQuestions(text){
  const normalized=normalizeArabicDigits(text).replace(/\u00a0/g,' ').replace(/\r/g,'');
  const blocks=normalized.split(/(?=(?:^|\n)\s*(?:س(?:ؤال)?\s*)?\d+\s*[\).:،-])/gim).map(x=>x.trim()).filter(Boolean);
  const chunks=blocks.length>1?blocks:[normalized.trim()];
  const out=[];
  for(const raw of chunks){
    if(!raw) continue;
    const lines=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean);
    let first=lines.shift()||'';
    first=first.replace(/^(?:س(?:ؤال)?\s*)?\d+\s*[\).:،-]?\s*/i,'').trim();
    const opts=[]; const rest=[];
    for(const line of lines){
      const m=line.match(/^\s*(?:[أإا]ول|[أإا]\s*[\).:؛-]|ب\s*[\).:؛-]|ج\s*[\).:؛-]|د\s*[\).:؛-]|[A-Da-d]\s*[\).:؛-]|\(?[1-4]\)?\s*[\).:؛-])\s*(.+)$/i);
      if(m) opts.push(m[1]||''); else rest.push(line);
    }
    let textPart=[first,...rest].join(' ').replace(/\s+/g,' ').trim();
    if(!textPart && opts.length) textPart='سؤال';
    out.push({text:textPart,options:opts,type:opts.length>=2?'mcq':'essay',correct:0,modelAnswer:''});
  }
  return out;
}

async function loadLinks(){
  try{
    await authReady;
    const cs=await getDocs(collection(db,'courses'));
    $('courseId').innerHTML='<option value="">بدون ربط</option>';
    cs.forEach(d=>{const x=d.data(); $('courseId').insertAdjacentHTML('beforeend',`<option value="${esc(d.id)}">${esc(x.name||'كورس')}</option>`);});
    const vs=await getDocs(collection(db,'videos'));
    $('videoId').innerHTML='<option value="">بدون ربط</option>';
    vs.forEach(d=>{const x=d.data(); $('videoId').insertAdjacentHTML('beforeend',`<option value="${esc(d.id)}">${esc(x.title||'فيديو')}</option>`);});
  }catch(e){console.warn(e);}
}

function render(){
  $('questions').innerHTML=questions.map((q,i)=>`
  <div class="q" data-i="${i}">
    <div><b>السؤال ${i+1}</b></div>
    <textarea class="qtext" rows="3">${esc(q.text)}</textarea>
    <label>نوع السؤال</label>
    <select class="qtype">
      <option value="mcq" ${q.type==='mcq'?'selected':''}>اختيار من متعدد</option>
      <option value="truefalse" ${q.type==='truefalse'?'selected':''}>صح أو خطأ</option>
      <option value="essay" ${q.type==='essay'?'selected':''}>مقالي / إجابة كتابية</option>
      <option value="short" ${q.type==='short'?'selected':''}>إجابة قصيرة</option>
      <option value="other" ${q.type==='other'?'selected':''}>نوع آخر</option>
    </select>
    <div class="opts">
      ${[0,1,2,3].map(j=>`<input class="opt" data-j="${j}" value="${esc(q.options?.[j]||'')}" placeholder="الاختيار ${j+1}">`).join('')}
    </div>
    <label>الإجابة الصحيحة</label>
    <select class="correct">
      <option value="0" ${String(q.correct)==='0'?'selected':''}>الأولى</option>
      <option value="1" ${String(q.correct)==='1'?'selected':''}>الثانية</option>
      <option value="2" ${String(q.correct)==='2'?'selected':''}>الثالثة</option>
      <option value="3" ${String(q.correct)==='3'?'selected':''}>الرابعة</option>
      <option value="true" ${q.correct===true||q.correct==='true'?'selected':''}>صح</option>
      <option value="false" ${q.correct===false||q.correct==='false'?'selected':''}>خطأ</option>
    </select>
    <input class="model" value="${esc(q.modelAnswer||'')}" placeholder="الإجابة النموذجية للمقالي / القصير">
  </div>`).join('');
  $('questionsCard').hidden=false;
}

$('imageFile').onchange=()=>{
  const f=$('imageFile').files[0];
  if(f){$('preview').src=URL.createObjectURL(f);$('preview').hidden=false;}
};
$('ocrBtn').onclick=async()=>{
  const f=$('imageFile').files[0]; if(!f)return alert('اختر صورة أولاً');
  $('status').textContent='⏳ جاري قراءة الصورة بالعربي...';
  try{
    const img=new Image(); img.src=URL.createObjectURL(f); await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;});
    const canvas=document.createElement('canvas'); const scale=Math.min(2.2,Math.max(1,1800/img.width)); canvas.width=Math.round(img.width*scale); canvas.height=Math.round(img.height*scale); const ctx=canvas.getContext('2d'); ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
    const {data}=await Tesseract.recognize(canvas,'ara+eng',{logger:m=>{
      if(m.status) $('status').textContent=`⏳ ${m.status} ${m.progress?Math.round(m.progress*100)+'%':''}`;
    },config:{tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'}});
    questions=parseQuestions(data.text);
    render();
    $('status').textContent=`✅ تم استخراج ${questions.length} سؤال. راجعهم قبل الحفظ.`;
  }catch(e){console.error(e);$('status').textContent='❌ فشلت قراءة الصورة: '+e.message;}
};
$('clearBtn').onclick=()=>{questions=[];$('questionsCard').hidden=true;$('status').textContent='جاهز.';$('preview').hidden=true;$('imageFile').value='';};

$('questions').addEventListener('input',e=>{
  const box=e.target.closest('.q'); if(!box)return; const i=+box.dataset.i;
  if(e.target.classList.contains('qtext')) questions[i].text=e.target.value;
  if(e.target.classList.contains('opt')) questions[i].options[e.target.dataset.j]=e.target.value;
  if(e.target.classList.contains('model')) questions[i].modelAnswer=e.target.value;
});
$('questions').addEventListener('change',e=>{
  const box=e.target.closest('.q'); if(!box)return; const i=+box.dataset.i;
  if(e.target.classList.contains('qtype')) questions[i].type=e.target.value;
  if(e.target.classList.contains('correct')) questions[i].correct=e.target.value;
});

loadLinks();

$('saveBtn').onclick=async()=>{
  if(!questions.length)return alert('لا توجد أسئلة');
  const title=$('examTitle').value.trim()||'اختبار جديد', grade=$('grade').value, courseId=$('courseId').value||'', videoId=$('videoId').value||'';
  $('status').textContent='⏳ جاري حفظ الاختبار...';
  try{
    await authReady;
    let sourceImageUrl='';
    const imageFile=$('imageFile').files[0];
    if(imageFile){
      try{ const fd=new FormData(); fd.append('key',IMGBB_API_KEY); fd.append('image',imageFile); const rr=await fetch('https://api.imgbb.com/1/upload',{method:'POST',body:fd}); const jj=await rr.json(); if(jj?.success) sourceImageUrl=jj.data.url||''; }catch(e){ console.warn('تعذر رفع صورة المصدر',e); }
    }
    const cleaned=questions.map(q=>{
      const x={text:q.text.trim(),type:q.type||'essay',options:(q.options||[]).map(s=>String(s||'').trim()).filter(Boolean)};
      if(x.type==='mcq') x.correct=Math.max(0,Math.min(3,Number(q.correct)||0));
      else if(x.type==='truefalse') x.correct=String(q.correct)==='true';
      else if(q.modelAnswer) x.modelAnswer=q.modelAnswer.trim();
      if(sourceImageUrl) x.imageUrl=sourceImageUrl;
      return x;
    });
    await addDoc(collection(db,'exams'),{title,grade,courseId,videoId,questions:cleaned,structured:true,createdAt:serverTimestamp(),source:'image-ocr'});
    $('status').textContent='✅ تم حفظ الاختبار بكل الأسئلة.';
    alert('تم حفظ الاختبار بنجاح');
  }catch(e){console.error(e);$('status').textContent='❌ تعذر الحفظ: '+e.message;}
};
</script>
</body>
</html>
