<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Vocabulary A1 & A2</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@500;600;700;800&display=swap');

:root{
    --navy:#17213d;
    --blue:#3157d5;
    --purple:#6c3fd1;
    --gold:#d6a84f;
    --text:#182033;
    --muted:#687187;
    --line:#e4e8f0;
    --soft:#f4f6ff;
    --bg:#eef2f7;
    --white:#fff;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Cairo,Arial,sans-serif;
}

/* ================= HEADER ================= */

.app{
    max-width:1250px;
    margin:auto;
    padding:24px;
}

.header{
    background:
        radial-gradient(circle at 15% 20%,#ffffff22,transparent 30%),
        radial-gradient(circle at 85% 80%,#ffffff15,transparent 30%),
        linear-gradient(135deg,var(--navy),var(--blue),var(--purple));

    color:white;
    padding:30px;
    border-radius:26px;
    box-shadow:0 18px 45px #17213d25;
}

.header h1{
    margin:0;
    font-size:32px;
    font-weight:800;
}

.header p{
    margin:5px 0 0;
    opacity:.85;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

button{
    border:0;
    border-radius:12px;
    padding:11px 17px;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

.btn{
    background:white;
    color:var(--navy);
}

.btn.dark{
    background:#10182e;
    color:white;
}

.btn.blue{
    background:#3157d5;
    color:white;
}

.search{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.search input{
    flex:1;
    border:0;
    border-radius:13px;
    padding:14px 17px;
    font-family:inherit;
    outline:none;
    font-size:15px;
}

/* ================= STATS ================= */

.stats{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin:18px 0;
}

.stat{
    background:white;
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px 20px;
    min-width:150px;
}

.stat strong{
    display:block;
    font-family:Inter,Arial,sans-serif;
    font-size:21px;
}

.stat span{
    color:var(--muted);
    font-size:13px;
}

/* ================= VIEWER ================= */

.viewer{
    background:#dfe4eb;
    padding:28px;
    border-radius:22px;
}

/* ================= A4 PAGE ================= */

.page,
.cover{
    width:210mm;
    height:297mm;
    background:white;
    margin:0 auto 28px;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 35px rgba(0,0,0,.13);
    break-after:page;
    page-break-after:always;
}

/* ================= COVER ================= */

.cover{
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:25mm;

    background:
        radial-gradient(circle at 15% 20%,#3157d520,transparent 35%),
        radial-gradient(circle at 85% 80%,#6c3fd125,transparent 35%),
        white;
}

.cover-content{
    width:100%;
    border:1px solid #dfe4ef;
    border-radius:28px;
    padding:50px 35px;
}

.badge{
    display:inline-block;
    background:var(--soft);
    color:var(--blue);
    padding:7px 18px;
    border-radius:999px;
    font-weight:800;
}

.level-big{
    font-family:Inter,Arial,sans-serif;
    direction:ltr;
    font-size:82px;
    font-weight:800;
    color:var(--blue);
    margin:15px 0;
}

.cover h2{
    font-size:42px;
    margin:0;
    font-family:Inter,Cairo,sans-serif;
}

.cover h3{
    font-size:23px;
}

.cover p{
    color:var(--muted);
}

/* ================= PAGE HEADER ================= */

.page{
    padding:13mm 12mm 17mm;
}

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--navy);
    padding-bottom:8px;
    margin-bottom:12px;
}

.page-header h2{
    margin:0;
    font-size:21px;
}

.page-header small{
    color:var(--muted);
}

.page-level{
    font-family:Inter,Arial,sans-serif;
    direction:ltr;
    font-weight:800;
    color:var(--blue);
}

/* ================= WORD GRID ================= */

.words{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    direction:ltr;
}

.word{
    direction:ltr;
    display:grid;
    grid-template-columns:35px 1fr;
    gap:8px;
    align-items:center;
    border:1px solid var(--line);
    border-radius:9px;
    padding:7px 9px;
    height:10.7mm;
    overflow:hidden;
    background:white;
}

.number{
    font-family:Inter,Arial,sans-serif;
    font-weight:800;
    color:var(--blue);
    text-align:center;
}

.english{
    font-family:Inter,Arial,sans-serif;
    font-weight:800;
    font-size:13px;
    line-height:1.1;
    direction:ltr;
    text-align:left;
}

.arabic{
    direction:rtl;
    text-align:right;
    color:var(--muted);
    font-size:10.5px;
    line-height:1.15;
    margin-top:1px;
}

/* ================= FOOTER ================= */

.footer{
    position:absolute;
    bottom:6mm;
    left:12mm;
    right:12mm;
    border-top:1px solid var(--line);
    padding-top:5px;
    display:flex;
    justify-content:space-between;
    color:#8a92a4;
    font-size:10px;
}

/* ================= SEARCH RESULTS ================= */

.no-results{
    text-align:center;
    padding:60px;
    color:var(--muted);
    background:white;
    border-radius:18px;
}

/* ================= PRINT ================= */

@media print{

    html,
    body{
        width:210mm;
        margin:0!important;
        padding:0!important;
        background:white!important;
    }

    body{
        -webkit-print-color-adjust:exact;
        print-color-adjust:exact;
    }

    .app{
        width:210mm;
        max-width:none;
        padding:0;
        margin:0;
    }

    .header,
    .stats,
    .controls,
    .search{
        display:none!important;
    }

    .viewer{
        width:210mm;
        padding:0!important;
        margin:0;
        background:white;
        border-radius:0;
    }

    .page,
    .cover{
        width:210mm!important;
        height:297mm!important;
        min-height:297mm!important;
        margin:0!important;
        box-shadow:none!important;
        overflow:hidden!important;
        break-after:page!important;
        page-break-after:always!important;
        break-inside:avoid!important;
        page-break-inside:avoid!important;
    }

    .cover{
        padding:25mm!important;
    }

    .words{
        grid-template-columns:1fr 1fr!important;
        direction:ltr!important;
        gap:7px!important;
    }

    .word{
        height:10.7mm!important;
        min-height:10.7mm!important;
        break-inside:avoid!important;
        page-break-inside:avoid!important;
    }

    .page:last-child,
    .cover:last-child{
        break-after:auto!important;
        page-break-after:auto!important;
    }
}

@page{
    size:A4 portrait;
    margin:0;
}

/* ================= MOBILE ================= */

@media(max-width:850px){

    .app{
        padding:10px;
    }

    .viewer{
        padding:10px;
        overflow:auto;
    }

    .page,
    .cover{
        flex:none;
    }

    .header h1{
        font-size:25px;
    }
}
</style>
</head>

<div class="app">

<header class="header">

    <h1>English Vocabulary A1 & A2</h1>

    <p>

    <div class="controls">

        <button class="btn dark"

        </button>

        <button class="btn"

        </button>

        <button class="btn"

    </div>

    <div class="search">

/* =========================================================
   IMPORTANT:
   Make exactly 500 unique words per level.
   ========================================================= */

function uniqueWords(list){

    const seen = new Set();

    return list.filter(item => {

        const key =
            item[0]
            .trim()
            .toLowerCase();

        if(seen.has(key)){
            return false;
        }

        seen.add(key);

        return true;

    });

}


const A1_FINAL =
    uniqueWords(A1).slice(0,500);

const A2_FINAL =
    uniqueWords(A2).slice(0,500);


/* =========================================================
   LEVEL
   ========================================================= */

let currentLevel = "ALL";


/* =========================================================
   COVER
   ========================================================= */

function createCover(level){

    const title =
        level === "A1"
        ? "Beginner"
        : "Elementary";

    return `

    <section class="cover">

        <div class="cover-content">

            <span class="badge">
                ENGLISH VOCABULARY
            </span>

            <div class="level-big">
                ${level}
            </div>

            <h2>
                ${title}
            </h2>

            <h3>
                500 English Words
            </h3>

            <p>
                500 كلمة إنجليزية مع الترجمة العربية
            </p>

            <p>
                English → Arabic
            </p>

        </div>

    </section>

    `;

}


/* =========================================================
   WORD CARD
   ========================================================= */

function createWord(
    number,
    english,
    arabic
){

    return `

    <div class="word">

        <div class="number">
            ${number}
        </div>

        <div>

            <div class="english">
                ${english}
            </div>

            <div class="arabic">
                ${arabic}
            </div>

        </div>

    </div>

    `;

}


/* =========================================================
   PAGE
   ========================================================= */

function createPage(
    level,
    words,
    startNumber,
    pageNumber,
    totalPages
){

    let cards = "";

    words.forEach(
        (word,index)=>{

            cards += createWord(

                startNumber + index,

                word[0],

                word[1]

            );

        }
    );


    return `

    <section class="page">

        <div class="page-header">

            <div>

                <h2>
                    English Vocabulary — ${level}
                </h2>

                <small>
                    Words
                    ${startNumber}
                    –
                    ${startNumber + words.length - 1}
                </small>

            </div>

            <div class="page-level">

                ${level}
                ·
                ${pageNumber}/${totalPages}

            </div>

        </div>


        <div class="words">

            ${cards}

        </div>


        <div class="footer">

            <span>
                English Vocabulary A1 & A2
            </span>

            <span>
                ${level} • Page ${pageNumber}
            </span>

        </div>

    </section>

    `;

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

    const viewer =
        document.getElementById("viewer");

    const input =
        document.getElementById("search");

    const search =
        input.value
        .trim()
        .toLowerCase();


    let levels =
        currentLevel === "ALL"
        ? ["A1","A2"]
        : [currentLevel];


    let html = "";


    /* ================= SEARCH ================= */

    if(search){

        let results = [];


        levels.forEach(level=>{

            const list =
                level === "A1"
                ? A1_FINAL
                : A2_FINAL;


            list.forEach(word=>{

                if(

                    word[0]
                    .toLowerCase()
                    .includes(search)

                    ||

                    word[1]
                    .includes(search)

                ){

                    results.push({
                        level,
                        word
                    });

                }

            });

        });


        if(!results.length){

            viewer.innerHTML = `

                <div class="no-results">

                    لا توجد كلمات مطابقة للبحث.

                </div>

            `;

            return;

        }


        let cards = "";


        results.forEach(
            (item,index)=>{

                cards += createWord(

                    index + 1,

                    item.word[0],

                    item.word[1]

                );

            }
        );


        viewer.innerHTML = `

            <section class="page">

                <div class="page-header">

                    <div>

                        <h2>
                            نتائج البحث
                        </h2>

                        <small>
                            ${results.length} كلمة
                        </small>

                    </div>

                    <div class="page-level">
                        SEARCH
                    </div>

                </div>

                <div class="words">
                    ${cards}
                </div>

            </section>

        `;

        return;

    }


    /* ================= NORMAL ================= */

    levels.forEach(level=>{

        const words =
            level === "A1"
            ? A1_FINAL
            : A2_FINAL;


        html += createCover(level);


        const totalPages =
            Math.ceil(words.length / 40);


        for(
            let i=0;
            i<words.length;
            i+=40
        ){

            const chunk =
                words.slice(i,i+40);


            html += createPage(

                level,

                chunk,

                i+1,

                Math.floor(i/40)+1,

                totalPages

            );

        }

    });


    viewer.innerHTML = html;

}


/* =========================================================
   LEVEL BUTTON
   ========================================================= */

function setLevel(level){

    currentLevel = level;

    render();

}


/* =========================================================
   CLEAR SEARCH
   ========================================================= */

function clearSearch(){

    document.getElementById("search").value = "";

    render();

}

        .textContent =
        A2_FINAL.length;

    document.getElementById("totalWords")
        .textContent =
        A1_FINAL.length +
        A2_FINAL.length;

}
