<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English Vocabulary D1 &amp; D2</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@500;600;700;800&display=swap');

:root{
    --navy:#17213d;
    --blue:#3157d5;
    --purple:#6c3fd1;
    --gold:#d6a84f;
    --text:#182033;
    --muted:#687187;
    --line:#e4e8f0;
    --soft:#f4f6ff;
    --bg:#eef2f7;
    --white:#fff;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Cairo,Arial,sans-serif;
}

.app{
    max-width:1250px;
    margin:auto;
    padding:24px;
}

.header{
    background:
        radial-gradient(circle at 15% 20%,#ffffff22,transparent 30%),
        radial-gradient(circle at 85% 80%,#ffffff15,transparent 30%),
        linear-gradient(135deg,var(--navy),var(--blue),var(--purple));

    color:white;
    padding:30px;
    border-radius:26px;
    box-shadow:0 18px 45px #17213d25;
}

.header h1{
    margin:0;
    font-size:32px;
    font-weight:800;
}

.header p{
    margin:5px 0 0;
    opacity:.85;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

button{
    border:0;
    border-radius:12px;
    padding:11px 17px;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

.btn{
    background:white;
    color:var(--navy);
}

.btn.dark{
    background:#10182e;
    color:white;
}

.btn.blue{
    background:#3157d5;
    color:white;
}

.search{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.search input{
    flex:1;
    border:0;
    border-radius:13px;
    padding:14px 17px;
    font-family:inherit;
    outline:none;
    font-size:15px;
}

.stats{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin:18px 0;
}

.stat{
    background:white;
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px 20px;
    min-width:150px;
}

.stat strong{
    display:block;
    font-family:Inter,Arial,sans-serif;
    font-size:21px;
}

.stat span{
    color:var(--muted);
    font-size:13px;
}

.viewer{
    background:#dfe4eb;
    padding:28px;
    border-radius:22px;
}

.page,
.cover{
    width:210mm;
    height:297mm;
    background:white;
    margin:0 auto 28px;
    position:relative;
    overflow:hidden;

    break-after:page;
    page-break-after:always;

    box-shadow:0 10px 35px rgba(0,0,0,.13);
}

.cover{
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:25mm;

    background:
        radial-gradient(circle at 15% 20%,#3157d520,transparent 35%),
        radial-gradient(circle at 85% 80%,#6c3fd125,transparent 35%),
        white;
}

.cover-content{
    width:100%;
    border:1px solid #dfe4ef;
    border-radius:28px;
    padding:50px 35px;
}

.badge{
    display:inline-block;
    background:var(--soft);
    color:var(--blue);
    padding:7px 18px;
    border-radius:999px;
    font-weight:800;
}

.level-big{
    font-family:Inter,Arial,sans-serif;
    direction:ltr;
    font-size:82px;
    font-weight:800;
    color:var(--blue);
    margin:15px 0;
}

.cover h2{
    font-size:42px;
    margin:0;
    font-family:Inter,Cairo,sans-serif;
}

.cover h3{
    font-size:23px;
}

.cover p{
    color:var(--muted);
}

.page{
    padding:13mm 12mm 17mm;
}

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;

    border-bottom:2px solid var(--navy);

    padding-bottom:8px;
    margin-bottom:12px;
}

.page-header h2{
    margin:0;
    font-size:21px;
}

.page-header small{
    color:var(--muted);
}

.page-level{
    font-family:Inter,Arial,sans-serif;
    direction:ltr;
    font-weight:800;
    color:var(--blue);
}

.words{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:7px;

    direction:ltr;
}

.word{
    direction:ltr;

    display:grid;
    grid-template-columns:35px 1fr;

    gap:8px;

    align-items:center;

    border:1px solid var(--line);

    border-radius:9px;

    padding:7px 9px;

    height:10.7mm;

    overflow:hidden;

    background:white;
}

.number{
    font-family:Inter,Arial,sans-serif;

    font-weight:800;

    color:var(--blue);

    text-align:center;
}

.english{
    font-family:Inter,Arial,sans-serif;

    font-weight:800;

    font-size:13px;

    line-height:1.1;

    direction:ltr;

    text-align:left;
}

.arabic{
    direction:rtl;

    text-align:right;

    color:var(--muted);

    font-size:10.5px;

    line-height:1.15;

    margin-top:1px;
}

.footer{
    position:absolute;

    bottom:6mm;

    left:12mm;
    right:12mm;

    border-top:1px solid var(--line);

    padding-top:5px;

    display:flex;

    justify-content:space-between;

    color:#8a92a4;

    font-size:10px;
}

.no-results{
    text-align:center;

    padding:60px;

    color:var(--muted);

    background:white;

    border-radius:18px;
}

@media print{

    html,
    body{
        width:210mm;

        margin:0!important;
        padding:0!important;

        background:white!important;
    }

    body{
        -webkit-print-color-adjust:exact;
        print-color-adjust:exact;
    }

    .app{
        width:210mm;

        max-width:none;

        padding:0;

        margin:0;
    }

    .header,
    .stats,
    .controls,
    .search{
        display:none!important;
    }

    .viewer{
        width:210mm;

        padding:0!important;

        margin:0;

        background:white;

        border-radius:0;
    }

    .page,
    .cover{

        width:210mm!important;

        height:297mm!important;

        min-height:297mm!important;

        margin:0!important;

        box-shadow:none!important;

        overflow:hidden!important;

        break-after:page!important;

        page-break-after:always!important;

        break-inside:avoid!important;

        page-break-inside:avoid!important;
    }

    .cover{
        padding:25mm!important;
    }

    .words{
        grid-template-columns:1fr 1fr!important;

        direction:ltr!important;

        gap:7px!important;
    }

    .word{
        height:10.7mm!important;

        min-height:10.7mm!important;

        break-inside:avoid!important;

        page-break-inside:avoid!important;
    }

    .page:last-child,
    .cover:last-child{

        break-after:auto!important;

        page-break-after:auto!important;
    }
}

@page{
    size:A4 portrait;

    margin:0;
}

@media(max-width:850px){

    .app{
        padding:10px;
    }

    .viewer{
        padding:10px;

        overflow:auto;
    }

    .page,
    .cover{
        flex:none;
    }

    .header h1{
        font-size:25px;
    }
}

</style>
</head>

<div class="app">

<header class="header">

    <h1>
        English Vocabulary D1 & D2
    </h1>

    <p>
        1000 كلمة إنجليزية مع الترجمة العربية

    <div class="controls">

        </button>

        <button class="btn"
                onclick="setLevel('D2')">
            🇬🇧 D2 فقط
        </button>

        <button class="btn"
                onclick="window.print()">
            🖨️ طباعة / حفظ PDF
        </button>

        <button class="btn"
                onclick="downloadPDF()">
            📥 تحميل PDF
        </button>

    </div>

    <div class="search">

        <input
            id="search"
            type="text"
            placeholder="ابحث بالإنجليزية أو العربية..."
            oninput="render()"
        >

        <button
            class="btn"

    </div>

</header>


<div class="stats">

    <div class="stat">

</div>


<div id="viewer" class="viewer"></div>

</div>

/* =========================================================

   ========================================================= */

let currentLevel = "ALL";


/* =========================================================
   HELPERS
   ========================================================= */

function allWords(){

    return [
        ...D1.map((item,index)=>({
            word:item[0],
            arabic:item[1],
            level:"D1",
            originalIndex:index + 1
        })),

        ...D2.map((item,index)=>({
            word:item[0],
            arabic:item[1],
            level:"D2",
            originalIndex:index + 1
        }))
    ];

}


function getFilteredWords(){

    const query =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();

    return allWords().filter(item=>{

        const levelMatch =
            currentLevel === "ALL" ||
            item.level === currentLevel;

        const searchMatch =
            !query ||
            item.word.toLowerCase().includes(query) ||
            item.arabic.toLowerCase().includes(query);

        return levelMatch && searchMatch;

    });

}


/* =========================================================
   COVER
   ========================================================= */

function createCover(level,title,subtitle,count){

    const cover = document.createElement("section");

    cover.className = "cover";

    cover.innerHTML = `

        <div class="cover-content">

            <span class="badge">
                English Vocabulary
            </span>

            <div class="level-big">
                ${level}
            </div>

            <h2>
                ${title}
            </h2>

            <h3>
                ${subtitle}
            </h3>

            <p>
                ${count} كلمة مع الترجمة العربية
            </p>

            <div style="
                margin-top:35px;
                font-family:Inter,Arial,sans-serif;
                font-size:14px;
                color:#687187;
                direction:ltr;
            ">
                Learn • Review • Practice
            </div>

        </div>

    `;

    return cover;

}


/* =========================================================
   PAGE
   ========================================================= */

function createPage(words,pageNumber,level){

    const page = document.createElement("section");

    page.className = "page";

    const title =
        level === "ALL"
        ? "English Vocabulary"
        : `${level} Vocabulary`;

    page.innerHTML = `

        <div class="page-header">

            <div>

                <h2>
                    ${title}
                </h2>

                <small>
                    English → Arabic
                </small>

            </div>

            <div class="page-level">
                ${level}
            </div>

        </div>

        <div class="words"></div>

        <div class="footer">

            <span>
                English Vocabulary D1 & D2
            </span>

            <span>
                Page ${pageNumber}
            </span>

        </div>

    `;

    const container =
        page.querySelector(".words");

    words.forEach((item,index)=>{

        const card =
            document.createElement("div");

        card.className = "word";

        card.innerHTML = `

            <div class="number">
                ${index + 1}
            </div>

            <div>

                <div class="english">
                    ${escapeHTML(item.word)}
                </div>

                <div class="arabic">
                    ${escapeHTML(item.arabic)}
                </div>

            </div>

        `;

        container.appendChild(card);

    });

    return page;

}


/* =========================================================
   SAFE TEXT
   ========================================================= */

function escapeHTML(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

    const viewer =
        document.getElementById("viewer");

    viewer.innerHTML = "";

    let words =
        getFilteredWords();

    if(words.length === 0){

        viewer.innerHTML = `

            <div class="no-results">

                <h2>
                    لا توجد نتائج
                </h2>

                <p>
                    جرّب كلمة بحث أخرى.
                </p>

            </div>

        `;

        updateStats([]);

        return;

    }


    /*
       عند اختيار ALL:
       D1 له غلاف مستقل
       ثم صفحات D1
       ثم D2 له غلاف مستقل
       ثم صفحات D2
    */

    if(currentLevel === "ALL"){

        renderLevelSection(
            viewer,
            D1,
            "D1",
            "Advanced D1 Vocabulary",
            "500 كلمة للمستوى المتوسط"
        );

        renderLevelSection(
            viewer,
            D2,
            "D2",
            "Upper-Advanced D1 Vocabulary",
            "500 كلمة للمستوى فوق المتوسط"
        );

    }else{

        const source =
            currentLevel === "D1"
            ? D1
            : D2;

        renderLevelSection(
            viewer,
            source,
            currentLevel,
            currentLevel === "D1"
            ? "Advanced D1 Vocabulary"
            : "Upper-Advanced D1 Vocabulary",
            currentLevel === "D1"
            ? "500 كلمة للمستوى المتوسط"
            : "500 كلمة للمستوى فوق المتوسط"
        );

    }


    updateStats(words);

}


/* =========================================================
   RENDER LEVEL
   ========================================================= */

function renderLevelSection(
    viewer,
    source,
    level,
    title,
    subtitle
){

    let words =
        source.map((item,index)=>({

            word:item[0],

            arabic:item[1],

            level:level,

            originalIndex:index + 1

        }));


    const query =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    if(query){

        words =
            words.filter(item=>

                item.word
                    .toLowerCase()
                    .includes(query)

                ||

                item.arabic
                    .toLowerCase()
                    .includes(query)

            );

    }


    if(words.length === 0){

        return;

    }


    viewer.appendChild(

        createCover(
            level,
            title,
            subtitle,
            source.length
        )

    );


    const perPage = 40;

    let pageNumber = 1;


    for(
        let i = 0;
        i < words.length;
        i += perPage
    ){

        const pageWords =
            words.slice(i,i + perPage);


        viewer.appendChild(

            createPage(
                pageWords,
                pageNumber,
                level
            )

        );


        pageNumber++;

    }

}


/* =========================================================
   LEVEL FILTER
   ========================================================= */

function setLevel(level){

    currentLevel = level;

    document
        .querySelectorAll(".controls .btn")
        .forEach(button=>{

            button.classList.remove("dark");

        });


    render();

}


/* =========================================================
   CLEAR SEARCH
   ========================================================= */

function clearSearch(){

    document
        .getElementById("search")
        .value = "";

    render();

}


/* =========================================================
   STATS
   ========================================================= */

function updateStats(words){

    const c1 =
        words.filter(
            item=>item.level === "D1"
        ).length;

    const c2 =
        words.filter(
            item=>item.level === "D2"
        ).length;


    document
        .getElementById("totalWords")
        .textContent = words.length;


    document
        .getElementById("c1Count")
        .textContent = c1;


    document
        .getElementById("c2Count")
        .textContent = c2;

}

   PDF
   ========================================================= */

function downloadPDF(){

    /*
       أفضل طريقة للحفاظ على تصميم A4
       هي استخدام محرك الطباعة الأصلي للمتصفح.
    */

    window.print();

}


/* =========================================================
   KEYBOARD SHORTCUT
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            (event.ctrlKey || event.metaKey) &&
            event.key.toLowerCase() === "p"
        ){

            event.preventDefault();

            window.print();

        }

    }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        render();

    }
);


/*
   في حالة وضع هذا الجزء أسفل الجزء الأول مباشرة،
   يتم تشغيل render بعد تحميل الصفحة.
*/

if(
    document.readyState === "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        render
    );

}else{

    render();

}
