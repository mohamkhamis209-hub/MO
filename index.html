<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصتك التعليمية</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif}body{min-height:100vh;background:linear-gradient(135deg,#0b1d33,#123c5d 55%,#10b981);display:grid;place-items:center;overflow:hidden;color:#fff}.page{width:min(520px,92vw);text-align:center;padding:28px}.logo{width:min(290px,72vw);aspect-ratio:1;object-fit:contain;background:#fff;border-radius:30px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.28);margin:0 auto 24px}.title{font-size:30px;font-weight:950;margin:0 0 9px}.sub{font-size:14px;color:#dbe8f0;line-height:1.9;margin:0 auto 25px}.start{width:100%;min-height:62px;border:0;border-radius:17px;background:#fff;color:#0b7f5c;font-size:21px;font-weight:950;cursor:pointer;box-shadow:0 16px 35px rgba(0,0,0,.22);transition:.2s}.start:hover{transform:translateY(-2px)}.small{margin-top:14px;color:#b9cbd7;font-size:11px}@media(max-width:480px){.page{padding:18px}.logo{width:min(245px,70vw);padding:14px;border-radius:24px}.title{font-size:24px}.sub{font-size:12px}.start{min-height:58px;font-size:19px}}
</style>
</head>
<body>
<main class="page">
<img class="logo" src="assets/platform-logo.png" alt="منصتك التعليمية">
<h1 class="title">منصتك التعليمية</h1>
<p class="sub">تعلم، اختبر نفسك، تابع تقدمك، واستمتع بكل محتواك التعليمي في مكان واحد.</p>
<button class="start" onclick="location.href='student-login.html'">ابدأ مجانًا 🚀</button>
<div class="small">© 2026 منصتك التعليمية</div>
</main>
</body>
</html>
